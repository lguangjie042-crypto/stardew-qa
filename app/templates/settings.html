{% extends "base.html" %}
{% block title %}账号设置 · 星露谷问答社{% endblock %}
{% block content %}
<section class="card">
  <div class="row">
    <h1>账号设置</h1>
    <a class="btn" href="/me">返回我的</a>
  </div>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% if notice %}<p class="notice">{{ notice }}</p>{% endif %}
</section>
<section class="card">
  <h2>修改用户名</h2>
  <form method="post" action="/me/username" class="stack">
    <label>新用户名 <input name="username" required minlength="2" maxlength="16" value="{{ user.username }}"></label>
    <button class="btn" type="submit">保存用户名</button>
  </form>
</section>
<section class="card">
  <h2>修改密码</h2>
  <form method="post" action="/me/password" class="stack">
    <label>当前密码 <input type="password" name="old_password" required></label>
    <label>新密码 <input type="password" name="new_password" required minlength="6"></label>
    <button class="btn" type="submit">更新密码</button>
  </form>
</section>
<section class="card">
  <h2>安全口令</h2>
  <p class="muted">忘记密码时，用用户名 + 安全口令重置。请记在别处，这里不会再显示原文。</p>
  <form method="post" action="/me/recovery" class="stack">
    <label>设置 / 更换安全口令 <input name="recovery" required minlength="4" placeholder="至少 4 位"></label>
    <button class="btn gold" type="submit">保存口令</button>
  </form>
</section>
{% endblock %}
